<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buscaminas</title>
    <meta name="description" content="Encuentra todas las minas sin detonar ninguna. ¡Usa la lógica y supera tu mejor tiempo!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/minesweeper/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Buscaminas — Puzzle">
    <meta property="og:description" content="Encuentra todas las minas sin detonar ninguna. ¡Usa la lógica y supera tu mejor tiempo!">
    <meta property="og:url" content="https://games.hahndev.com/minesweeper/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Buscaminas — Puzzle">
    <meta name="twitter:description" content="Encuentra todas las minas sin detonar ninguna. ¡Usa la lógica y supera tu mejor tiempo!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="mineBoard" class="mine-board"></div>
                <button id="flagToggle" class="flag-toggle">🚩 Bandera: OFF</button>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Buscaminas</h1>
                <p>Encuentra todas las minas sin detonar ninguna. Clic derecho para marcar, o usa el botón de bandera en móvil.</p>
                <div class="score-panel">
                    <span>Minas: <span id="mineCount">40</span></span>
                    <span>Tiempo: <span id="timer">0</span>s</span>
                    <span>Mejor: <span id="highScore">--</span>s</span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Juego terminado!</h2>
                <p id="finalScore">Tiempo: 0s</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var board = document.getElementById('mineBoard');
            var availableWidth = window.innerWidth - 16;
            var availableHeight = vHeight - (isMobile() ? 60 : 0);
            var w = Math.min(availableWidth, availableHeight * 500 / 380);
            var h = w * 380 / 500;
            board.style.width = w + 'px';
            board.style.height = h + 'px';
        },
        reset: function () {
            var board = document.getElementById('mineBoard');
            board.style.width = '';
            board.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
