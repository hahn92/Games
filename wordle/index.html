<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wordle</title>
    <meta name="description" content="Adivina la palabra de 5 letras en 6 intentos. Las pistas de color te guiarán hacia la respuesta.">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/wordle/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Wordle — Palabras">
    <meta property="og:description" content="Adivina la palabra de 5 letras en 6 intentos. Las pistas de color te guiarán hacia la respuesta.">
    <meta property="og:url" content="https://games.hahndev.com/wordle/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Wordle — Palabras">
    <meta name="twitter:description" content="Adivina la palabra de 5 letras en 6 intentos. Las pistas de color te guiarán hacia la respuesta.">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="wordleGrid" class="wordle-grid"></div>
                <p id="statusMsg"></p>
                <div id="wordleKeyboard" class="wordle-keyboard">
                    <div class="key-row" id="keyRow1"></div>
                    <div class="key-row" id="keyRow2"></div>
                    <div class="key-row" id="keyRow3"></div>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Wordle</h1>
                <p>Adivina la palabra de 5 letras en 6 intentos. 🟩 = correcta, 🟨 = en otra posición, ⬛ = no está.</p>
                <div class="score-panel">
                    <span>Victorias: <span id="wins">0</span></span>
                    <span>Racha: <span id="streak">0</span></span>
                    <span>Mejor racha: <span id="bestStreak">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Nueva palabra</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Ganaste!</h2>
                <p id="finalScore"></p>
                <p id="revealWord" style="font-size:1rem;color:#888;"></p>
                <button id="playAgainBtn">Nueva palabra</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        onMobile: function (gameSide, vHeight) {
            var vWidth = window.innerWidth;
            gameSide.style.overflowX = 'hidden';
            gameSide.style.overflowY = 'auto';
            var kbd = document.getElementById('wordleKeyboard');
            if (kbd) kbd.style.width = Math.min(vWidth - 16, 390) + 'px';
        },
        onReset: function (gameSide) {
            gameSide.style.overflowX = '';
            gameSide.style.overflowY = '';
        },
        reset: function () {
            var kbd = document.getElementById('wordleKeyboard');
            if (kbd) kbd.style.width = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
