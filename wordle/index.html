<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wordle</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="wordleGrid" class="wordle-grid"></div>
                <p id="statusMsg"></p>
                <div id="wordleKeyboard" class="wordle-keyboard">
                    <div class="key-row" id="keyRow1"></div>
                    <div class="key-row" id="keyRow2"></div>
                    <div class="key-row" id="keyRow3"></div>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Wordle</h1>
                <p>Adivina la palabra de 5 letras en 6 intentos. 🟩 = correcta, 🟨 = en otra posición, ⬛ = no está.</p>
                <div class="score-panel">
                    <span>Victorias: <span id="wins">0</span></span>
                    <span>Racha: <span id="streak">0</span></span>
                    <span>Mejor racha: <span id="bestStreak">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Nueva palabra</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Ganaste!</h2>
                <p id="finalScore"></p>
                <p id="revealWord" style="font-size:1rem;color:#888;"></p>
                <button id="playAgainBtn">Nueva palabra</button>
            </div>
        </div>
    </main>
    <script>
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    function adjustMobileLayout() {
        var gameSide = document.getElementById('gameSide');
        var infoSide = document.getElementById('infoSide');
        var mobileStartBtn = document.getElementById('mobileStartBtn');
        var mobileScore = document.getElementById('mobileScore');
        var vHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

        if (isMobile() || window.innerWidth < 900) {
            if (isMobile()) {
                var vWidth = window.innerWidth;
                gameSide.style.position = 'fixed';
                gameSide.style.top = '0';
                gameSide.style.left = '0';
                gameSide.style.width = vWidth + 'px';
                gameSide.style.height = vHeight + 'px';
                gameSide.style.zIndex = '999';
                gameSide.style.background = 'var(--grad-bg)';
                gameSide.style.overflowX = 'hidden';
                gameSide.style.overflowY = 'auto';
                infoSide.style.display = 'none';
                mobileStartBtn.style.display = 'block';
                mobileScore.style.display = 'block';
                // Keyboard width: fit within actual viewport with margin
                var kbd = document.getElementById('wordleKeyboard');
                if (kbd) kbd.style.width = Math.min(vWidth - 16, 390) + 'px';
            }
        } else {
            gameSide.style.position = '';
            gameSide.style.top = '';
            gameSide.style.left = '';
            gameSide.style.width = '';
            gameSide.style.height = '';
            gameSide.style.zIndex = '';
            gameSide.style.background = '';
            gameSide.style.overflowX = '';
            gameSide.style.overflowY = '';
            infoSide.style.display = '';
            mobileStartBtn.style.display = 'none';
            mobileScore.style.display = 'none';
            var kbd = document.getElementById('wordleKeyboard');
            if (kbd) kbd.style.width = '';
        }
    }
    window.addEventListener('resize', adjustMobileLayout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', function() {
        var mobileStartBtn = document.getElementById('mobileStartBtn');
        var startBtn = document.getElementById('startBtn');
        if (mobileStartBtn) {
            mobileStartBtn.addEventListener('click', function() {
                if (startBtn) startBtn.click();
                mobileStartBtn.style.display = 'none';
            });
        }
    });
    </script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
