<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flappy Bird</title>
    <meta name="description" content="Haz que el pájaro vuele entre los tubos sin chocar. ¡Consigue la mayor distancia posible!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/flappybird/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Flappy Bird — Arcade">
    <meta property="og:description" content="Haz que el pájaro vuele entre los tubos sin chocar. ¡Consigue la mayor distancia posible!">
    <meta property="og:url" content="https://games.hahndev.com/flappybird/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Flappy Bird — Arcade">
    <meta name="twitter:description" content="Haz que el pájaro vuele entre los tubos sin chocar. ¡Consigue la mayor distancia posible!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="flappyCanvas" width="320" height="480" class="flappy-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Flappy Bird</h1>
                <p>Haz que el pájaro vuele entre los tubos sin chocar. ¡Consigue la mayor distancia posible!</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        stopPropagation: true,
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var canvas = document.getElementById('flappyCanvas');
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var availableWidth = window.innerWidth - 16;
            var ratio = 320 / 480;
            var newHeight = Math.min(availableHeight, availableWidth / ratio);
            var newWidth = newHeight * ratio;
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('flappyCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
