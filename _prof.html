<body><pre id="o" style="color:#0f0;background:#000">…</pre><iframe id="f" width="900" height="800" style="border:0"></iframe>
<script>
var q=new URLSearchParams(location.search);
var f=document.getElementById('f'), o=document.getElementById('o');
f.src='./'+q.get('game')+'/index.html';
f.addEventListener('load',function(){
 var d=f.contentDocument, w=f.contentWindow;
 var cvs=d.querySelector('canvas'), ctx=cvs.getContext('2d');
 var NAMES=['fillRect','fill','stroke','fillText','arc','ellipse','drawImage','createLinearGradient',
            'createRadialGradient','beginPath','save','moveTo','lineTo','quadraticCurveTo','bezierCurveTo'];
 var live=0;                       // ops del intervalo actual
 NAMES.forEach(function(m){ if(!ctx[m])return; var o2=ctx[m]; ctx[m]=function(){live++;return o2.apply(ctx,arguments);}; });
 // envolver cada funcion global que empiece por draw
 var acc={}, frames=0;
 Object.keys(w).forEach(function(k){
   if(typeof w[k]!=='function' || !/^draw/.test(k)) return;
   var orig=w[k]; acc[k]=0;
   w[k]=function(){ var a=live; var r=orig.apply(this, arguments); acc[k]+=live-a; return r; };
 });
 var rq=w.requestAnimationFrame.bind(w);
 w.requestAnimationFrame=function(fn){return rq(function(ts){frames++;return fn(ts);});};
 var b=d.getElementById('startBtn'); if(b&&!b.disabled)b.click();
 w.setTimeout(function(){
   var out=Object.keys(acc).filter(function(k){return acc[k]>0;})
     .sort(function(a,b2){return acc[b2]-acc[a];})
     .map(function(k){ return k+': '+Math.round(acc[k]/(frames||1))+' ops/frame'; });
   out.unshift('frames medidos: '+frames);
   o.textContent=out.join('\n');
 }, 2500);
});
</script></body>
