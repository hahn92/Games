<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pacman</title>
    <meta name="description" content="Come todos los puntos evitando a los fantasmas. ¡Usa las pastillas de poder para devorarlos!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/pacman/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Pac-Man — Arcade">
    <meta property="og:description" content="Come todos los puntos evitando a los fantasmas. ¡Usa las pastillas de poder para devorarlos!">
    <meta property="og:url" content="https://games.hahndev.com/pacman/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Pac-Man — Arcade">
    <meta name="twitter:description" content="Come todos los puntos evitando a los fantasmas. ¡Usa las pastillas de poder para devorarlos!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="pacmanCanvas" width="560" height="560" class="pacman-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="touchControls" class="touch-controls"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Pacman</h1>
                <p>Come todos los puntos evitando los fantasmas. Los puntos grandes te permiten comer fantasmas por 5 segundos.</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor: <span id="highScore">0</span></span>
                </div>
                <div class="score-panel">
                    <span>Nivel: <span id="level">1</span></span>
                    <span>Vidas: <span id="lives">3</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
                <div style="margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem; line-height:1.6;">
                    <strong>Controles:</strong><br>
                    Flechas / WASD — mover<br>
                    Móvil: deslizar para cambiar dirección
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">Game Over</h2>
                <p id="finalScore">Puntaje: 0</p>
                <p id="finalHigh" style="font-size:1rem;color:#8fd3f4;"></p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        background: '#000',
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var canvas = document.getElementById('pacmanCanvas');
            var ratio = 560 / 560;
            var availableWidth = window.innerWidth - 8;
            var availableHeight = vHeight - (isMobile() ? 48 : 0);
            var newWidth = Math.min(availableWidth, availableHeight * ratio);
            var newHeight = newWidth / ratio;
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
            canvas.style.margin = '0 auto';
        },
        reset: function () {
            var canvas = document.getElementById('pacmanCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
