<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Atrapa Frutas</title>
    <meta name="description" content="Mueve la cesta para atrapar las frutas que caen. ¡Cuidado con las bombas, te cuestan una vida!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/fruitcatcher/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Atrapa Frutas — Arcade">
    <meta property="og:description" content="Mueve la cesta para atrapar las frutas que caen. ¡Cuidado con las bombas, te cuestan una vida!">
    <meta property="og:url" content="https://games.hahndev.com/fruitcatcher/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Atrapa Frutas — Arcade">
    <meta name="twitter:description" content="Mueve la cesta para atrapar las frutas que caen. ¡Cuidado con las bombas, te cuestan una vida!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <canvas id="catcherCanvas" width="400" height="500" class="catcher-canvas"></canvas>
                <div id="touchControls" class="touch-controls">
                    <button class="touch-btn" id="btnLeft">◀</button>
                    <button class="touch-btn" id="btnRight">▶</button>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Atrapa Frutas</h1>
                <p>Mueve la cesta para atrapar las frutas. ¡Evita las bombas! Cada fruta vale puntos, cada bomba quita una vida.</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor: <span id="highScore">0</span></span>
                    <span>Vidas: <span id="lives">3</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block', touchControls: 'flex' },
        fit: function (vHeight) {
            var canvas = document.getElementById('catcherCanvas');
            var availableH = vHeight - (isMobile() ? 50 : 0);
            var availableW = window.innerWidth - 8;
            var ratio = 400 / 500;
            var h = Math.min(availableH, availableW / ratio);
            var w = h * ratio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('catcherCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
