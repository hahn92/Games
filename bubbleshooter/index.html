<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bubble Shooter</title>
    <meta name="description" content="Apunta y dispara burbujas de colores. ¡Agrupa 3 o más del mismo color para hacerlas explotar!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/bubbleshooter/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Bubble Shooter — Arcade">
    <meta property="og:description" content="Apunta y dispara burbujas de colores. ¡Agrupa 3 o más del mismo color para hacerlas explotar!">
    <meta property="og:url" content="https://games.hahndev.com/bubbleshooter/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Bubble Shooter — Arcade">
    <meta name="twitter:description" content="Apunta y dispara burbujas de colores. ¡Agrupa 3 o más del mismo color para hacerlas explotar!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="bubbleCanvas" width="400" height="550" class="bubble-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="touchControls" class="touch-controls"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Bubble Shooter</h1>
                <p>Apunta con el ratón y haz clic para disparar. Conecta 3 o más burbujas del mismo color para hacerlas explotar. Las burbujas sin soporte caen y dan puntos extra.</p>
                <div class="score-panel">
                    <span>Puntos: <span id="score">0</span></span>
                    <span>Mejor: <span id="highScore">0</span></span>
                </div>
                <div class="score-panel">
                    <span>Nivel: <span id="level">1</span></span>
                    <span>Disparos: <span id="shots">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <p id="finalLevel">Nivel: 1</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var canvas = document.getElementById('bubbleCanvas');
            var ratio = 400 / 550;
            var availableWidth = window.innerWidth - 8;
            var availableHeight = vHeight - (isMobile() ? 40 : 0);
            var newHeight = Math.min(availableHeight, availableWidth / ratio);
            var newWidth = newHeight * ratio;
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('bubbleCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
