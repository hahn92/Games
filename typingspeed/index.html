<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Velocidad de Escritura</title>
    <meta name="description" content="Escribe palabras lo más rápido que puedas en 60 segundos. ¿Cuántas palabras por minuto eres capaz?">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/typingspeed/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Velocidad de Escritura — Habilidad">
    <meta property="og:description" content="Escribe palabras lo más rápido que puedas en 60 segundos. ¿Cuántas palabras por minuto eres capaz?">
    <meta property="og:url" content="https://games.hahndev.com/typingspeed/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Velocidad de Escritura — Habilidad">
    <meta name="twitter:description" content="Escribe palabras lo más rápido que puedas en 60 segundos. ¿Cuántas palabras por minuto eres capaz?">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div class="typing-panel">
                    <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
                    <div class="stats-row">
                        <span>Tiempo: <strong id="timerDisplay">60</strong>s</span>
                        <span>Palabras: <strong id="wordCount">0</strong></span>
                        <span>WPM: <strong id="wpm">0</strong></span>
                    </div>
                    <div class="target-word" id="targetWord">—</div>
                    <input type="text" class="word-input" id="wordInput" placeholder="Escribe aquí..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
                    <div class="upcoming-words" id="upcomingWords"></div>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Velocidad</h1>
                <p>Escribe las palabras lo más rápido que puedas en 60 segundos. ¡Pulsa Enter o espacio para confirmar!</p>
                <div class="score-panel">
                    <span>WPM: <span id="score">0</span></span>
                    <span>Mejor WPM: <span id="highScore">0</span></span>
                    <span>Palabras: <span id="totalWords">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Tiempo!</h2>
                <p id="finalScore"></p>
                <p id="finalWords" style="font-size:1rem;color:#888;"></p>
                <button id="playAgainBtn">Jugar de nuevo</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
