<body style="margin:0;background:#111"><pre id="o" style="color:#0f0;background:#000;font-size:11px;margin:0"></pre>
<iframe id="f" width="390" height="760" style="border:0;display:block"></iframe>
<script>
/* Vertical -> horizontal -> vertical, redimensionando el iframe y lanzando un
   resize DE VERDAD: docs/trampas.md avisa de que llamar a adjustMobileLayout()
   a mano se salta el listener propio del juego y deja su lógica con el tamaño
   viejo. */
var q=new URLSearchParams(location.search);
var f=document.getElementById('f'), o=document.getElementById('o');
f.src='./'+q.get('game')+'/index.html';
f.addEventListener('load',function(){
 var d=f.contentDocument, w=f.contentWindow, pasos=[];
 var b=d.getElementById('startBtn'); if(b&&!b.disabled)b.click();
 function medir(etiqueta){
   var c=d.querySelector('canvas');
   var r=c?c.getBoundingClientRect():null;
   var doc=d.documentElement;
   pasos.push({fase:etiqueta, vw:w.innerWidth, vh:w.innerHeight,
     cw:r?Math.round(r.width):0, ch:r?Math.round(r.height):0,
     der:r?Math.round(r.right):0,
     scrollX:doc.scrollWidth-w.innerWidth});
 }
 function girar(W,H,cb){ f.width=W; f.height=H; w.dispatchEvent(new w.Event('resize')); w.setTimeout(cb,350); }
 w.setTimeout(function(){
   medir('vertical');
   girar(760,390,function(){
     medir('horizontal');
     girar(390,760,function(){
       medir('vertical otra vez');
       var p=[];
       pasos.forEach(function(s){
         var mal=[];
         if(s.scrollX>0) mal.push('scroll-x '+s.scrollX);
         if(s.der>s.vw+1) mal.push('se sale '+(s.der-s.vw)+'px');
         if(s.cw>s.vw+1) mal.push('canvas mas ancho que el viewport');
         p.push(s.fase+': '+s.cw+'x'+s.ch+' en '+s.vw+'x'+s.vh+(mal.length?'  ** '+mal.join(', '):'  ok'));
       });
       var v1=pasos[0], v3=pasos[2];
       p.push(Math.abs(v1.cw-v3.cw)<2 && Math.abs(v1.ch-v3.ch)<2 ? 'recupera su tamano: si' : 'recupera su tamano: NO ('+v1.cw+'x'+v1.ch+' -> '+v3.cw+'x'+v3.ch+')');
       o.textContent=p.join('\n');
     });
   });
 },700);
});
</script></body>
