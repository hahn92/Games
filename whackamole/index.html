<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Whack-a-Mole</title>
    <meta name="description" content="¡Golpea los topos antes de que se escondan! Pon a prueba tus reflejos en 60 segundos.">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/whackamole/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Whack-a-Mole — Arcade">
    <meta property="og:description" content="¡Golpea los topos antes de que se escondan! Pon a prueba tus reflejos en 60 segundos.">
    <meta property="og:url" content="https://games.hahndev.com/whackamole/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Whack-a-Mole — Arcade">
    <meta name="twitter:description" content="¡Golpea los topos antes de que se escondan! Pon a prueba tus reflejos en 60 segundos.">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <div id="moleGrid" class="mole-grid"></div>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Whack-a-Mole</h1>
                <p>¡Golpea a los topos antes de que se escondan! Tienes 60 segundos. ¡A mayor puntaje, más rápido aparecen!</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                    <span>Tiempo: <span id="timer">60</span>s</span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        mobileOnly: true,
        show: { mobileScore: 'block' },
        onMobile: function (gameSide, vHeight) {
            var grid = document.getElementById('moleGrid');
            var size = Math.min(window.innerWidth - 32, vHeight - 60, 420);
            grid.style.width = size + 'px';
            grid.style.height = size + 'px';
        },
        reset: function () {
            var grid = document.getElementById('moleGrid');
            grid.style.width = '';
            grid.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
