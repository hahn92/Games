<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>2048</title>
    <meta name="description" content="Combina los números iguales para llegar al 2048. ¡Piensa cada movimiento y supera tu mejor puntaje!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/2048/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="2048 — Puzzle">
    <meta property="og:description" content="Combina los números iguales para llegar al 2048. ¡Piensa cada movimiento y supera tu mejor puntaje!">
    <meta property="og:url" content="https://games.hahndev.com/2048/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="2048 — Puzzle">
    <meta name="twitter:description" content="Combina los números iguales para llegar al 2048. ¡Piensa cada movimiento y supera tu mejor puntaje!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <div id="game2048" class="game-2048"></div>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="touchControls" class="touch-controls">
                    <button class="touch-btn" id="btnUp">▲</button>
                    <div class="touch-row">
                        <button class="touch-btn" id="btnLeft">◀</button>
                        <button class="touch-btn" id="btnDown">▼</button>
                        <button class="touch-btn" id="btnRight">▶</button>
                    </div>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>2048</h1>
                <p>Combina los números iguales para llegar al 2048. ¡Piensa cada movimiento y supera tu mejor puntaje!</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { touchControls: 'flex', mobileScore: 'block' },
        fit: function (vHeight) {
            var gameGrid = document.getElementById('game2048');
            var availableHeight = vHeight - (isMobile() ? 60 : 0);
            var availableWidth = window.innerWidth - 32;
            var size = Math.min(availableWidth, availableHeight, 500);
            gameGrid.style.width = size + 'px';
            gameGrid.style.height = size + 'px';
        },
        reset: function () {
            var gameGrid = document.getElementById('game2048');
            gameGrid.style.width = '';
            gameGrid.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
