<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Platformer</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="platformerCanvas" width="600" height="400"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score">Puntos: 0 | Vidas: 3 | Nivel: 1</div>
                <div id="levelPopup">
                    <h2 id="levelTitle">Nivel completado</h2>
                    <p id="levelMsg"></p>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Platformer</h1>
                <p>Mueve con A/D o flechas. Salta con Espacio/W/Arriba (doble salto). Colecta las estrellas y llega a la puerta de salida.</p>
                <div class="score-panel">
                    <span>Puntos: <strong id="score">0</strong></span>
                    <span>Mejor: <strong id="highScore">0</strong></span>
                    <span>Vidas: <strong id="lives">3</strong></span>
                    <span>Nivel: <strong id="levelDisplay">1</strong></span>
                    <span>Estrellas: <strong id="starsDisplay">0/10</strong></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>Juego Terminado</h2>
                <p id="finalScore">Puntos: 0</p>
                <p id="finalHigh"></p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script>
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    function adjustMobileLayout() {
        var gameSide = document.getElementById('gameSide');
        var infoSide = document.getElementById('infoSide');
        var mobileStartBtn = document.getElementById('mobileStartBtn');
        var mobileScore = document.getElementById('mobileScore');
        var canvas = document.getElementById('platformerCanvas');
        var vHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        if (isMobile() || window.innerWidth < 900) {
            if (isMobile()) {
                gameSide.style.position = 'fixed';
                gameSide.style.top = '0';
                gameSide.style.left = '0';
                gameSide.style.width = window.innerWidth + 'px';
                gameSide.style.height = vHeight + 'px';
                gameSide.style.zIndex = '999';
                gameSide.style.background = 'var(--grad-bg)';
                infoSide.style.display = 'none';
                mobileStartBtn.style.display = 'block';
                mobileScore.style.display = 'block';
            }
            var ratio = 600 / 400;
            var availableWidth = window.innerWidth - 8;
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var newWidth = Math.min(availableWidth, availableHeight * ratio);
            var newHeight = newWidth / ratio;
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        } else {
            gameSide.style.position = '';
            gameSide.style.top = '';
            gameSide.style.left = '';
            gameSide.style.width = '';
            gameSide.style.height = '';
            gameSide.style.zIndex = '';
            gameSide.style.background = '';
            infoSide.style.display = '';
            mobileStartBtn.style.display = 'none';
            mobileScore.style.display = 'none';
            canvas.style.width = '';
            canvas.style.height = '';
        }
    }
    window.addEventListener('resize', adjustMobileLayout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('mobileStartBtn');
        var startBtn = document.getElementById('startBtn');
        if (btn) btn.addEventListener('click', function() {
            if (startBtn) startBtn.click();
            btn.style.display = 'none';
        });
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
