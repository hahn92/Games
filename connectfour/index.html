<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Conecta 4</title>
    <meta name="description" content="Conecta 4 fichas en línea antes que la IA. ¡Piensa varios movimientos por adelantado!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/connectfour/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Conecta 4 — Estrategia">
    <meta property="og:description" content="Conecta 4 fichas en línea antes que la IA. ¡Piensa varios movimientos por adelantado!">
    <meta property="og:url" content="https://games.hahndev.com/connectfour/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Conecta 4 — Estrategia">
    <meta name="twitter:description" content="Conecta 4 fichas en línea antes que la IA. ¡Piensa varios movimientos por adelantado!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <canvas id="c4Canvas" width="420" height="360" class="c4-canvas"></canvas>
                <div id="touchCols" class="touch-cols">
                    <button class="col-btn" data-col="0">1</button>
                    <button class="col-btn" data-col="1">2</button>
                    <button class="col-btn" data-col="2">3</button>
                    <button class="col-btn" data-col="3">4</button>
                    <button class="col-btn" data-col="4">5</button>
                    <button class="col-btn" data-col="5">6</button>
                    <button class="col-btn" data-col="6">7</button>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Conecta 4</h1>
                <p>Conecta 4 fichas en línea antes que la IA. Tú eres rojo, la IA es amarillo.</p>
                <div class="score-panel">
                    <span>Victorias: <span id="wins">0</span></span>
                    <span>Derrotas: <span id="losses">0</span></span>
                    <span>Empates: <span id="draws">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Resultado!</h2>
                <p id="finalScore"></p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block', touchCols: 'flex' },
        fit: function (vHeight) {
            var canvas = document.getElementById('c4Canvas');
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var availableWidth = window.innerWidth - 16;
            var ratio = 420 / 360;
            var newHeight = Math.min(availableHeight, availableWidth / ratio);
            var newWidth = newHeight * ratio;
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('c4Canvas');
            var touchCols = document.getElementById('touchCols');
            touchCols.style.display = '';
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
