<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Laberinto Neón</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="laberintoCanvas" width="360" height="560" class="laberinto-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Explorar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Laberinto Neon</h1>
                <p>Navega por el laberinto generado proceduralmente. Usa las <strong>flechas</strong> o <strong>WASD</strong> para moverte, o <strong>desliza el dedo</strong> en pantallas táctiles. Alcanza la salida naranja en el menor tiempo posible.</p>
                <div class="score-panel">
                    <span>Nivel: <span id="levelDisplay">1</span></span>
                    <span>Tiempo: <span id="timerDisplay">00:00.0</span></span>
                    <span>Récord: <span id="bestTimeDisplay">--:--.-</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="winPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="winTitle">Laberinto completado!</h2>
                <p id="winTime">Tiempo: 0.0s</p>
                <p id="winBest" style="font-size:1.1rem;color:#8fd3f4;"></p>
                <button id="nextLevelBtn">Siguiente nivel</button>
                <button id="replayBtn" style="margin-top:0.5rem;background:transparent;border:1px solid #8fd3f4;color:#8fd3f4;">Repetir nivel</button>
            </div>
        </div>
    </main>
    <script>
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    function adjustMobileLayout() {
        var gameSide = document.getElementById('gameSide');
        var infoSide = document.getElementById('infoSide');
        var mobileStartBtn = document.getElementById('mobileStartBtn');
        var mobileScore = document.getElementById('mobileScore');
        var canvas = document.getElementById('laberintoCanvas');
        var vHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        if (isMobile() || window.innerWidth < 900) {
            if (isMobile()) {
                gameSide.style.position = 'fixed';
                gameSide.style.top = '0';
                gameSide.style.left = '0';
                gameSide.style.width = window.innerWidth + 'px';
                gameSide.style.height = vHeight + 'px';
                gameSide.style.zIndex = '999';
                gameSide.style.background = 'var(--grad-bg)';
                infoSide.style.display = 'none';
                mobileStartBtn.style.display = 'block';
                mobileScore.style.display = 'block';
            }
            var ratio = 360 / 560;
            var availableWidth = window.innerWidth - 16;
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var newHeight = Math.min(availableHeight, availableWidth / ratio);
            var newWidth = newHeight * ratio;
            if (newWidth > availableWidth) { newWidth = availableWidth; newHeight = newWidth / ratio; }
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        } else {
            gameSide.style.position = '';
            gameSide.style.top = '';
            gameSide.style.left = '';
            gameSide.style.width = '';
            gameSide.style.height = '';
            gameSide.style.zIndex = '';
            gameSide.style.background = '';
            infoSide.style.display = '';
            mobileStartBtn.style.display = 'none';
            mobileScore.style.display = 'none';
            canvas.style.width = '';
            canvas.style.height = '';
        }
    }
    window.addEventListener('resize', adjustMobileLayout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', adjustMobileLayout);
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('mobileStartBtn');
        var startBtn = document.getElementById('startBtn');
        if (btn) btn.addEventListener('click', function() {
            if (startBtn) startBtn.click();
            btn.style.display = 'none';
        });
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
