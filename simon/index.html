<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Simon Says</title>
    <meta name="description" content="Repite la secuencia de colores que muestra Simon. ¡Cada ronda se vuelve más difícil!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/simon/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Simon Dice — Memoria">
    <meta property="og:description" content="Repite la secuencia de colores que muestra Simon. ¡Cada ronda se vuelve más difícil!">
    <meta property="og:url" content="https://games.hahndev.com/simon/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Simon Dice — Memoria">
    <meta name="twitter:description" content="Repite la secuencia de colores que muestra Simon. ¡Cada ronda se vuelve más difícil!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <div id="simonBoard" class="simon-board">
                    <button class="simon-btn" id="btn-red" data-color="red"></button>
                    <button class="simon-btn" id="btn-blue" data-color="blue"></button>
                    <button class="simon-btn" id="btn-green" data-color="green"></button>
                    <button class="simon-btn" id="btn-yellow" data-color="yellow"></button>
                </div>
                <div id="status"></div>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Simon Says</h1>
                <p>Observa la secuencia de colores y repítela en el mismo orden. ¡Cada ronda agrega un color más!</p>
                <div class="score-panel">
                    <span>Ronda: <span id="level">0</span></span>
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        mobileOnly: true,
        show: { mobileScore: 'block' },
        onMobile: function (gameSide, vHeight) {
            var board = document.getElementById('simonBoard');
            var size = Math.min(window.innerWidth - 32, vHeight - 60, 380);
            board.style.width = size + 'px';
            board.style.height = size + 'px';
        },
        reset: function () {
            var board = document.getElementById('simonBoard');
            board.style.width = '';
            board.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
