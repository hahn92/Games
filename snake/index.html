<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Snake Clásico</title>
    <meta name="description" content="Controla la serpiente, come frutas y evita chocar contra las paredes o tu propio cuerpo. ¡Compite por la mejor puntuación!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/snake/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Snake Clásico — Arcade">
    <meta property="og:description" content="Controla la serpiente, come frutas y evita chocar contra las paredes o tu propio cuerpo. ¡Compite por la mejor puntuación!">
    <meta property="og:url" content="https://games.hahndev.com/snake/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Snake Clásico — Arcade">
    <meta name="twitter:description" content="Controla la serpiente, come frutas y evita chocar contra las paredes o tu propio cuerpo. ¡Compite por la mejor puntuación!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:linear-gradient(90deg,#8fd3f4 0%,#ff512f 100%);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="touchControls" class="touch-controls">
                    <button class="touch-btn" id="btnUp">▲</button>
                    <div class="touch-row">
                        <button class="touch-btn" id="btnLeft">◀</button>
                        <button class="touch-btn" id="btnDown">▼</button>
                        <button class="touch-btn" id="btnRight">▶</button>
                    </div>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Snake Clásico</h1>
                <p>Controla la serpiente, come frutas y evita chocar contra las paredes o tu propio cuerpo.<br>¡Compite por la mejor puntuación!</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        mobileOnly: true,
        onMobile: function (gameSide, vHeight) {
            var canvas = document.getElementById('gameCanvas');
            var minDim = Math.min(window.innerWidth, vHeight - 50);
            var size = Math.max(240, minDim - 8);
            canvas.width = size;
            canvas.height = size;
            canvas.style.maxWidth = '100%';
            canvas.style.maxHeight = (vHeight - 50) + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('gameCanvas');
            canvas.width = 600;
            canvas.height = 600;
            canvas.style.maxWidth = '';
            canvas.style.maxHeight = '';
        },
    });
    </script>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
