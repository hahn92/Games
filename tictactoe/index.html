<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tres en Raya</title>
    <meta name="description" content="Juega al clásico Tres en Raya contra una IA imbatible. ¿Podrás hacer empate?">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/tictactoe/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Tres en Raya — Estrategia">
    <meta property="og:description" content="Juega al clásico Tres en Raya contra una IA imbatible. ¿Podrás hacer empate?">
    <meta property="og:url" content="https://games.hahndev.com/tictactoe/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Tres en Raya — Estrategia">
    <meta name="twitter:description" content="Juega al clásico Tres en Raya contra una IA imbatible. ¿Podrás hacer empate?">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="tttBoard" class="ttt-board">
                    <div class="ttt-cell" data-index="0"></div>
                    <div class="ttt-cell" data-index="1"></div>
                    <div class="ttt-cell" data-index="2"></div>
                    <div class="ttt-cell" data-index="3"></div>
                    <div class="ttt-cell" data-index="4"></div>
                    <div class="ttt-cell" data-index="5"></div>
                    <div class="ttt-cell" data-index="6"></div>
                    <div class="ttt-cell" data-index="7"></div>
                    <div class="ttt-cell" data-index="8"></div>
                </div>
                <p id="statusMsg"></p>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Tres en Raya</h1>
                <p>Juega contra la IA. Tú eres X, la IA es O. ¡Consigue tres en línea para ganar!</p>
                <div class="score-panel">
                    <span>Victorias: <span id="wins">0</span></span>
                    <span>Derrotas: <span id="losses">0</span></span>
                    <span>Empates: <span id="draws">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2 id="popupTitle">¡Resultado!</h2>
                <p id="finalScore"></p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var board = document.getElementById('tttBoard');
            var size = Math.min(window.innerWidth - 32, vHeight - (isMobile() ? 60 : 0), 400);
            board.style.width = size + 'px';
            board.style.height = size + 'px';
        },
        reset: function () {
            var board = document.getElementById('tttBoard');
            board.style.width = '';
            board.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
