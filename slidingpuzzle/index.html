<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Puzzle Deslizante</title>
    <meta name="description" content="Desliza las piezas para ordenarlas del 1 al 15. ¡Resuelve el clásico puzzle deslizante en el menor tiempo!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/slidingpuzzle/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Puzzle 15 — Puzzle">
    <meta property="og:description" content="Desliza las piezas para ordenarlas del 1 al 15. ¡Resuelve el clásico puzzle deslizante en el menor tiempo!">
    <meta property="og:url" content="https://games.hahndev.com/slidingpuzzle/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Puzzle 15 — Puzzle">
    <meta name="twitter:description" content="Desliza las piezas para ordenarlas del 1 al 15. ¡Resuelve el clásico puzzle deslizante en el menor tiempo!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
                <div id="puzzleBoard" class="puzzle-board"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Puzzle 15</h1>
                <p>Desliza las piezas para ordenarlas del 1 al 15. Haz clic en una pieza adyacente al hueco para moverla.</p>
                <div class="score-panel">
                    <span>Movimientos: <span id="moves">0</span></span>
                    <span>Tiempo: <span id="timer">0</span>s</span>
                    <span>Mejor: <span id="highScore">--</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Nuevo</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Resuelto! 🎉</h2>
                <p id="finalScore"></p>
                <button id="playAgainBtn">Nuevo puzzle</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var board = document.getElementById('puzzleBoard');
            var size = Math.min(window.innerWidth - 32, vHeight - (isMobile() ? 60 : 0), 400);
            board.style.width = size + 'px';
            board.style.height = size + 'px';
        },
        reset: function () {
            var board = document.getElementById('puzzleBoard');
            board.style.width = '';
            board.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
