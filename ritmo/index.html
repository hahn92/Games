<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ritmo</title>
    <meta name="description" content="Toca el carril correcto justo cuando el bloque cruce la línea brillante. 4 carriles, velocidad creciente y 3 vidas. ¡Encadena combos perfectos y marca un nuevo récord!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/ritmo/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Ritmo — Ritmo">
    <meta property="og:description" content="Toca el carril correcto justo cuando el bloque cruce la línea brillante. 4 carriles, velocidad creciente y 3 vidas. ¡Encadena combos perfectos y marca un nuevo récord!">
    <meta property="og:url" content="https://games.hahndev.com/ritmo/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ritmo — Ritmo">
    <meta name="twitter:description" content="Toca el carril correcto justo cuando el bloque cruce la línea brillante. 4 carriles, velocidad creciente y 3 vidas. ¡Encadena combos perfectos y marca un nuevo récord!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="ritmoCanvas" width="360" height="560" class="ritmo-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Tocar para jugar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Ritmo</h1>
                <p>Toca el carril correcto justo cuando el bloque cruce la línea brillante. 4 carriles, velocidad creciente y 3 vidas. ¡Encadena combos y consigue el récord!</p>
                <div class="score-panel">
                    <span>Puntos: <span id="score">0</span></span>
                    <span>Combo: <span id="combo">0</span></span>
                    <span>Récord: <span id="highScore">0</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Fuera de compás!</h2>
                <p id="finalScore">Puntos: 0</p>
                <p id="finalBest" style="font-size:1.1rem;color:#8fd3f4;"></p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var canvas = document.getElementById('ritmoCanvas');
            var ratio = 360 / 560;
            var availableWidth = window.innerWidth - 16;
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var newHeight = Math.min(availableHeight, availableWidth / ratio);
            var newWidth = newHeight * ratio;
            if (newWidth > availableWidth) { newWidth = availableWidth; newHeight = newWidth / ratio; }
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('ritmoCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
