<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Memorama</title>
    <meta name="description" content="Encuentra todas las parejas de cartas en el menor tiempo posible. ¡Pon a prueba tu memoria!">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/memorama/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Memorama — Puzzle">
    <meta property="og:description" content="Encuentra todas las parejas de cartas en el menor tiempo posible. ¡Pon a prueba tu memoria!">
    <meta property="og:url" content="https://games.hahndev.com/memorama/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Memorama — Puzzle">
    <meta name="twitter:description" content="Encuentra todas las parejas de cartas en el menor tiempo posible. ¡Pon a prueba tu memoria!">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <div id="memoramaBoard" class="memorama-board"></div>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileInfo" class="mobile-score" style="top: auto; bottom: 10px; right: 10px; display: none;">
                    Puntaje: <span id="mScore">0</span> | Tiempo: <span id="mTimer">3:00</span>
                </div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Memorama</h1>
                <p>Encuentra todas las parejas de cartas en el menor tiempo posible. ¡Pon a prueba tu memoria!</p>
                <div class="score-panel">
                    <span>Puntaje: <span id="score">0</span></span>
                    <span>Mejor puntaje: <span id="highScore">0</span></span>
                    <span>Tiempo: <span id="timer">3:00</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </div>
        <div id="gameOverPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>¡Juego terminado!</h2>
                <p id="finalScore">Puntaje: 0</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileInfo: 'block' },
        fit: function (vHeight) {
            var board = document.getElementById('memoramaBoard');
            var availableHeight = vHeight - (isMobile() ? 60 : 0);
            var availableWidth = window.innerWidth - 32;
            var size = Math.min(availableWidth, availableHeight, 600);
            board.style.width = size + 'px';
            board.style.height = size + 'px';
        },
        reset: function () {
            var board = document.getElementById('memoramaBoard');
            board.style.width = '';
            board.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
