<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sokoban — Empuja Cajas</title>
    <meta name="description" content="Empuja cajas hasta las marcas del suelo en 10 niveles de dificultad creciente. No puedes jalar, solo empujar. Planifica cada movimiento y bate tu récord de pasos.">
    <meta name="theme-color" content="#181818">
    <link rel="canonical" href="https://games.hahndev.com/sokoban/">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Juegos Web JS/CSS">
    <meta property="og:title" content="Empuja Cajas — Lógica">
    <meta property="og:description" content="Empuja cajas hasta las marcas del suelo en 10 niveles de dificultad creciente. No puedes jalar, solo empujar. Planifica cada movimiento y bate tu récord de pasos.">
    <meta property="og:url" content="https://games.hahndev.com/sokoban/">
    <meta property="og:image" content="https://games.hahndev.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Empuja Cajas — Lógica">
    <meta name="twitter:description" content="Empuja cajas hasta las marcas del suelo en 10 niveles de dificultad creciente. No puedes jalar, solo empujar. Planifica cada movimiento y bate tu récord de pasos.">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <div class="responsive-layout">
            <div class="game-side" id="gameSide">
                <canvas id="sokobanCanvas" width="360" height="560" class="sokoban-canvas"></canvas>
                <button id="mobileStartBtn" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:1rem 2.5rem;font-size:1.3rem;border-radius:12px;background:var(--grad-primary);color:#222;font-weight:bold;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);">Iniciar</button>
                <div id="mobileScore" class="mobile-score"></div>
            </div>
            <div class="info-side" id="infoSide">
                <h1>Empuja Cajas</h1>
                <p>Empuja todas las cajas hasta las marcas del suelo. No puedes jalar, solo empujar. Planifica bien cada movimiento.</p>
                <div class="score-panel">
                    <span>Nivel: <span id="levelDisplay">1</span></span>
                    <span>Movimientos: <span id="movesDisplay">0</span></span>
                    <span>Mejor: <span id="bestDisplay">—</span></span>
                </div>
                <div class="buttons-panel">
                    <button id="startBtn">Iniciar</button>
                    <button id="restartBtn" disabled>Reiniciar</button>
                    <button id="undoBtn" disabled>Deshacer</button>
                </div>
                <p class="hint">Flechas / WASD para mover. En móvil: desliza el dedo.</p>
            </div>
        </div>
        <div id="winPopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>Nivel completado!</h2>
                <p id="winMsg">Movimientos: 0</p>
                <p id="bestMsg"></p>
                <button id="nextLevelBtn">Siguiente nivel</button>
            </div>
        </div>
        <div id="allDonePopup" class="popup" style="display:none;">
            <div class="popup-content">
                <h2>Enhorabuena!</h2>
                <p>Completaste todos los niveles.</p>
                <button id="playAgainBtn">Volver a jugar</button>
            </div>
        </div>
    </main>
    <script src="../mobile-layout.js"></script>
    <script>
    MobileLayout({
        show: { mobileScore: 'block' },
        fit: function (vHeight) {
            var canvas = document.getElementById('sokobanCanvas');
            var ratio = 360 / 560;
            var availableWidth = window.innerWidth - 16;
            var availableHeight = vHeight - (isMobile() ? 50 : 0);
            var newWidth, newHeight;
            if (availableWidth / ratio <= availableHeight) {
                newWidth = availableWidth;
                newHeight = availableWidth / ratio;
            } else {
                newHeight = availableHeight;
                newWidth = availableHeight * ratio;
            }
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        },
        reset: function () {
            var canvas = document.getElementById('sokobanCanvas');
            canvas.style.width = '';
            canvas.style.height = '';
        },
    });
    </script>
    <script src="../audio.js"></script>
    <script src="../game-utils.js"></script>
    <script src="./main.js"></script>
    <script src="../fullscreen-btn.js"></script>
</body>
</html>
